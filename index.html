const storageKey='hotel-price-custom-records',deletedKey='hotel-price-deleted-records';let deletedIds=[];try{deletedIds=JSON.parse(localStorage.getItem(deletedKey)||'[]')}catch{}try{const saved=JSON.parse(localStorage.getItem(storageKey)||'[]');if(Array.isArray(saved))data.push(...saved)}catch{}

const addForm=document.querySelector('#addForm'),addName=addForm.elements.name,addRegion=addForm.elements.region;function guessEditableRegion(name){const guess=matchHotelLocation(name,'');return guess.startsWith('待识别·')?'':guess}function syncEditableRegion(nameInput,regionInput){if(regionInput.dataset.manual==='true')return;const guess=guessEditableRegion(nameInput.value);regionInput.value=guess;regionInput.dataset.auto=guess}function markRegionManual(regionInput){regionInput.dataset.manual=regionInput.value.trim()?'true':'false'}function syncAddRegion(){syncEditableRegion(addName,addRegion)}addName.addEventListener('input',syncAddRegion);addName.addEventListener('change',syncAddRegion);addRegion.addEventListener('input',()=>markRegionManual(addRegion));const updateName=updateForm.elements.name,updateRegion=updateForm.elements.region;updateName.addEventListener('input',()=>syncEditableRegion(updateName,updateRegion));updateRegion.addEventListener('input',()=>markRegionManual(updateRegion));addForm.addEventListener('click',event=>{const button=event.target.closest('[data-search-engine]');if(!button)return;const hotel=addName.value.trim();if(!hotel){addName.focus();return}const query=encodeURIComponent(hotel+' 酒店 国家 城市 地址');const url=button.dataset.searchEngine==='baidu'?'https://www.baidu.com/s?wd='+query:'https://www.google.com/search?q='+query;window.open(url,'_blank','noopener,noreferrer')});function openAddForm(){addForm.classList.add('open');document.body.classList.add('adding');addRegion.value='';addRegion.dataset.manual='false';addRegion.dataset.auto='';requestAnimationFrame(()=>addName.focus())}document.querySelector('#headerAdd').addEventListener('click',openAddForm);document.querySelector('#toggleAdd').addEventListener('click',openAddForm);document.querySelector('#cancelAdd').addEventListener('click',()=>{addForm.reset();addForm.classList.remove('open');document.body.classList.remove('adding')});addForm.addEventListener('submit',event=>{event.preventDefault
